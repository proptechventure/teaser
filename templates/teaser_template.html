<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial; padding: 30px; }
    .header img { width: 150px; }
    .section { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <img src="{{ logo_path }}" alt="Company Logo">
    <h1>{{ summary['company_name'] }}</h1>
  </div>

  <div class="section">
    <h2>О компании</h2>
    <p>{{ summary['description'] }}</p>
  </div>

  <div class="section">
    <h2>Финансовые метрики</h2>
    <ul>
      <li>Выручка: {{ financials['revenue'] }}</li>
      <li>EBITDA: {{ financials['ebitda'] }}</li>
      <li>LTV / CAC: {{ financials['ltv'] }} / {{ financials['cac'] }}</li>
    </ul>
  </div>
</body>
</html>
